<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D 迷宫 · Maze Game</title>
<!-- 空 favicon：消掉 404 噪音（本地预览/无 favicon 部署都会报一条） -->
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0d12; color: #e8ecf4; overflow: hidden;
    font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#canvas {
    display: block;
    /* raylib 自己按 WINDOW_WIDTH/HEIGHT 设内部分辨率，
       这里只负责把它等比缩放到窗口里，保持 16:9 不变形 */
    max-width: 100%; max-height: 100%;
    image-rendering: auto;
    outline: none;
  }
  /* ---- 加载遮罩：模块没就绪之前盖住画面 ---- */
  #splash {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; background: radial-gradient(circle at 50% 40%, #16203a 0%, #0b0d12 70%);
    transition: opacity .45s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #title {
    font-size: 34px; letter-spacing: .28em; font-weight: 700;
    background: linear-gradient(90deg, #6fe3c4, #7ab8ff, #c79bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #bar { width: min(46vw, 380px); height: 6px; border-radius: 99px; background: #1d2433; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0%; border-radius: 99px;
             background: linear-gradient(90deg, #6fe3c4, #7ab8ff); transition: width .2s ease; }
  #status { font-size: 14px; color: #8a94a8; letter-spacing: .06em; }
  #tips { font-size: 13px; color: #5d6678; max-width: 460px; text-align: center; line-height: 1.9; }
  kbd {
    background: #1b2233; border: 1px solid #2c3648; border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 7px; font-size: 12px; color: #b9c4d8;
  }
  /* 环境自检 + 真实报错：不用开 F12 就能看清到底哪儿不对 */
  #env { font-size: 12px; color: #5d6678; line-height: 1.9; font-family: ui-monospace, Consolas, monospace; }
  #env .bad { color: #ff8a8a; font-weight: 600; }
  /* 加载失败时的兜底提示 */
  #fail { display: none; font-size: 14px; color: #ff8a8a; text-align: center; line-height: 1.9; }
  #failmsg { display: block; margin: 6px 0; font-family: ui-monospace, Consolas, monospace;
             font-size: 12px; color: #ffd08a; word-break: break-all; }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas></div>

<div id="splash">
  <div id="title">3D 迷 宫</div>
  <div id="bar"><i id="fill"></i></div>
  <div id="status">正在加载引擎…</div>
  <div id="tips">
    <kbd>W A S D</kbd> 移动 · <kbd>Shift</kbd> 奔跑 · <kbd>Space</kbd> 跳跃 ·
    <kbd>鼠标</kbd> 转视角 · <kbd>左键</kbd> 射击 · <kbd>V</kbd> 切视角 ·
    <kbd>Tab</kbd> 锁定鼠标 · <kbd>ESC</kbd> 暂停<br>
    浏览器只允许"用户点一下之后"锁鼠标 —— 进游戏后<b>点一下画面</b>就能转视角了
  </div>
  <div id="env"></div>
  <div id="fail">
    <b>引擎启动失败 —— 真正的原因是下面这行：</b>
    <span id="failmsg">（引擎没给出报错文本，先看上面那行环境自检）</span>
    另外：必须通过 HTTP(S) 访问，双击 index.html 用 <code>file://</code> 打开会被 CORS 拦住。
  </div>
</div>

<script src="config.js"></script>
<script>
  // 引擎最后一条报错。abort 时页面上要显示它本身，而不是我瞎猜的原因
  var lastErr = '';

  // config.js 里的 MAZE_CONFIG -> C++ 侧要读的两个全局量
  //   MAZE_API_BASE：排行榜后端基地址（Leaderboard.cpp 用 EM_ASM_PTR 读）
  //   MAZE_ONLINE  ：false 时彻底不联网（本地 log.csv 照写）
  (function () {
    var cfg = window.MAZE_CONFIG || {};
    window.MAZE_ONLINE = (cfg.online !== false);
    window.MAZE_API_BASE = cfg.apiBase || '';
  })();
</script>
<script>
  // Emscripten 的 Module 配置要在 loader 脚本之前定义
  var Module = {
    canvas: (function () { return document.getElementById('canvas'); })(),
    locateFile: function (path) { return path; },
    print:    function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); lastErr = String(t || ''); },
    onAbort:  function (what) { showFail('abort: ' + what); },
    setStatus: function (text) {
      if (!text) { return; }
      var m = /\((\d+)\/(\d+)\)/.exec(text);
      if (m) {
        setProgress(Number(m[1]) / Number(m[2]));
        setStatus('正在下载资源… ' + Math.round(Number(m[1]) / 1048576) + ' / ' + Math.round(Number(m[2]) / 1048576) + ' MB');
      } else {
        setStatus(text);
      }
    },
    onRuntimeInitialized: function () {
      // 运行时起来了就把遮罩淡出，交给 raylib 接管
      setProgress(1);
      setStatus('准备就绪');
      var s = document.getElementById('splash');
      s.classList.add('hidden');
      setTimeout(function () { s.style.display = 'none'; }, 500);
      // 让 canvas 拿到焦点，键盘事件才不会丢
      document.getElementById('canvas').focus();
    }
  };

  function setProgress(p01) {
    if (!isFinite(p01) || p01 < 0) { return; }
    document.getElementById('fill').style.width = Math.max(2, Math.min(100, p01 * 100)) + '%';
  }
  function setStatus(t) { document.getElementById('status').textContent = t; }
  function showFail(what) {
    var msg = String(what || '') || lastErr || '（无错误文本）';
    console.error('[maze] fail:', msg);
    var s = document.getElementById('splash');
    s.classList.remove('hidden'); s.style.display = 'flex';
    document.getElementById('failmsg').textContent = msg;
    document.getElementById('fail').style.display = 'block';
    document.querySelector('#bar').style.display = 'none';
    setStatus('加载失败');
  }

  // ---- 环境自检：先搞清楚"到底是不是 GL 的锅" ----
  function probeGL() {
    var lines = [];
    function has(name) {
      try {
        var c = document.createElement('canvas');
        var g = c.getContext(name, { failIfMajorPerformanceCaveat: false });
        if (!g) { g = c.getContext('experimental-' + name); }
        if (g) {
          var lose = g.getExtension && g.getExtension('WEBGL_lose_context');
          if (lose) { lose.loseContext(); }        // 探测完就把上下文还回去
          return true;
        }
      } catch (e) { return false; }
      return false;
    }
    var gl1 = has('webgl'), gl2 = has('webgl2');
    lines.push('<span class="' + (gl1 || gl2 ? '' : 'bad') + '">WebGL1=' +
               (gl1 ? 'yes' : 'NO') + '  WebGL2=' + (gl2 ? 'yes' : 'NO') + '</span>');
    if (!gl1 && !gl2) {
      lines.push('<span class="bad">→ 浏览器没给出任何 WebGL 上下文：' +
                 '在 Edge 地址栏打开 edge://gpu 看 "WebGL: Disabled" 之类，' +
                 '或在 设置→系统和性能 里打开"使用图形加速"</span>');
    } else if (!gl2) {
      lines.push('→ 只有 WebGL1：本项目 raylib 走 GLES2 路径，够用，不是问题');
    }
    lines.push('页面来自 ' + location.protocol + '//' + location.host +
               '（必须 http/https，file:// 会被 CORS 拦）');
    document.getElementById('env').innerHTML = lines.join('<br>');
  }

  probeGL();

  // ---- 鼠标视角：pointer lock 只能由用户手势触发 ----
  //   raylib 请求锁定的时候如果不在用户手势里，浏览器会直接拒；被拒之后它不会再试，
  //   于是"鼠标完全转不动视角"。这里在画布上补一次手势内的请求。
  //   该不该补，看 Module.mazeWantPointerLock —— 那是 C++ 侧 raylib 后端在
  //   DisableCursor() / EnableCursor() 里维护的"游戏到底想不想锁鼠标"。
  //   菜单里游戏是明确解锁的，那会儿补锁会把鼠标坐标钉在画面中央，菜单反而点不动。
  //   另外：游戏里的 Tab 仍然可以正常解锁/锁定（键盘事件也算用户手势）。
  (function () {
    var cv = document.getElementById('canvas');
    function relock() {
      if (document.pointerLockElement === cv) return;       // 已经锁着就别管
      if (Module.mazeWantPointerLock !== true) return;      // 游戏没想锁定 -> 别插手
      try { cv.requestPointerLock(); } catch (e) { /* 退出锁定后的冷却期内会失败，下次点击再试 */ }
    }
    cv.addEventListener('mousedown', function () { setTimeout(relock, 0); });
  })();

  // 未捕获的脚本错误 / Promise 崩溃也走同一套兜底 UI
  window.addEventListener('error', function (e) {
    showFail(e.message || (e.target && (e.target.src || e.target.href)) || 'script error');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    showFail('unhandledrejection: ' + ((e.reason && e.reason.message) || e.reason));
  });
</script>
<!-- 下面这个占位符会被 Emscripten 换成当前目标的 loader（index.js / probe.js），
     它自带完整的 <script> 标签，所以这里不要再套一层 -->
{{{ SCRIPT }}}
</body>
</html>
